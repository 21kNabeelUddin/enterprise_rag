# Derived vector index: Qdrant. Fully rebuildable from Postgres, so it holds no
# unique state. Bring it up only after Postgres is populated.
#   docker compose -f compose.qdrant.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # REST / dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  qdrant_storage:
