[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ingest"
version = "0.1.0"
description = "Enterprise RAG for SEC EDGAR 10-K filings: ingestion (Pipeline 1) and question answering (Pipeline 2)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=2.0",
    "orjson>=3.10",
    "sentence-transformers>=6.0",
    "torch>=2.6",
    "transformers>=5.0",
    "huggingface_hub>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "typer>=0.15",
    "rich>=13",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "langgraph>=0.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.12"]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.7"]

[project.scripts]
rag-ingest = "rag_ingest.cli:app"
rag-ask = "rag_query.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_query = ["static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
